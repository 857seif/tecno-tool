[package]
name = "not-techno-tool"
version = "1.0.0"
description = "Not Techno Tool"
authors = ["not-techno-tool"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
zip = "9"
winreg = "0.52"
uuid = { version = "1", features = ["v4"] }
regex = "1"
walkdir = "2"
once_cell = "1"
rfd = "0.15"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
